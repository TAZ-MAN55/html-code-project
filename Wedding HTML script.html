<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group,
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-option,
        .checkbox-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .radio-option label,
        .checkbox-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .status-message {
            text-align: center;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Event RSVP</h1>
        <p class="subtitle">Please fill out this form to confirm your attendance</p>

        <div id="statusMessage" class="status-message"></div>

        <form id="rsvpForm">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="guests">Number of Guests (including you) *</label>
                <input type="number" id="guests" name="guests" min="1" value="1" required>
            </div>

            <div class="form-group">
                <label>Will you be attending? *</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="attending-yes" name="attending" value="Yes" required>
                        <label for="attending-yes">Yes, I will attend</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="attending-no" name="attending" value="No">
                        <label for="attending-no">No, I cannot attend</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="attending-maybe" name="attending" value="Maybe">
                        <label for="attending-maybe">Maybe</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Dietary Restrictions</label>
                <div class="checkbox-group">
                    <div class="checkbox-option">
                        <input type="checkbox" id="vegetarian" name="dietary" value="Vegetarian">
                        <label for="vegetarian">Vegetarian</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="vegan" name="dietary" value="Vegan">
                        <label for="vegan">Vegan</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="glutenfree" name="dietary" value="Gluten Free">
                        <label for="glutenfree">Gluten Free</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="none" name="dietary" value="None">
                        <label for="none">No restrictions</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="comments">Additional Comments</label>
                <textarea id="comments" name="comments" placeholder="Share any additional information..."></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit" id="submitBtn">Submit RSVP</button>
                <button type="reset" class="btn-reset">Clear Form</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('rsvpForm');
        const statusMessage = document.getElementById('statusMessage');
        const submitBtn = document.getElementById('submitBtn');

        // ============================================
        // IMPORTANT: Replace this URL with your Apps Script deployment URL
        // Get this URL after deploying your Google Apps Script as a web app
        // Paste the complete URL between the quotes below
        // ============================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzl-HjHBIhS1y53uVEGU8fqZPaRqk6Qxbd5a5GKpINWH_i8Wz6CKnoo7m1lRjaPELKX/exec';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!SCRIPT_URL || SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbzl-HjHBIhS1y53uVEGU8fqZPaRqk6Qxbd5a5GKpINWH_i8Wz6CKnoo7m1lRjaPELKX/exec') {
                showMessage('Please add your Google Apps Script URL in the code first', 'error');
                return;
            }

            // Collect form data
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            // Handle multiple dietary restrictions
            const dietaryCheckboxes = document.querySelectorAll('input[name="dietary"]:checked');
            data.dietary = Array.from(dietaryCheckboxes).map(cb => cb.value).join(', ') || 'None';

            // Disable submit button and show loading state
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.innerHTML = '<span class="loading"></span>Submitting...';

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(data)
                });

                // Show success message
                showMessage('Thank you! Your RSVP has been received.', 'success');
                form.reset();

                // Re-enable submit button
                setTimeout(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                showMessage('There was an error submitting your form. Please try again.', 'error');

                // Re-enable submit button
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });

        function showMessage(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;

            // Auto-hide error messages after 5 seconds
            if (type === 'error') {
                setTimeout(() => {
                    statusMessage.className = 'status-message';
                }, 5000);
            }
        }
    </script>
</body>
</html>
